name: Build FFmpeg Android App

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 21.4.7075529
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build cmake pkg-config meson

      - name: Run FFmpeg Build Script
        run: |
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh
          
      - name: Ensure Assets Directory exists and binary is there
        run: |
          mkdir -p app/src/main/assets/armeabi-v7a/
          if [ -f "build_out/ffmpeg/ffmpeg" ]; then
            cp build_out/ffmpeg/ffmpeg app/src/main/assets/armeabi-v7a/ffmpeg
          fi
          ls -l app/src/main/assets/armeabi-v7a/

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
