name: Build FFmpeg Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nmi/setup-ndk@v1
        with:
          ndk-version: 21.4.7075529

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build meson nasm yasm pkg-config
          sudo pip3 install meson ninja

      - name: Cache FFmpeg build
        uses: actions/cache@v3
        id: cache-ffmpeg
        with:
          path: |
            build_android
            app/src/main/assets/armeabi-v7a/ffmpeg
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('build_ffmpeg.sh') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.0.2

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
