plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ffmpegminimal'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.example.ffmpegminimal"
        minSdk 24
        targetSdk 24
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}